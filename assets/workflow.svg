<svg width="960" height="300" viewBox="0 0 960 300" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif">
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#94a3b8"/>
    </marker>
    <marker id="arr-indigo" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#6366f1"/>
    </marker>
    <marker id="arr-dashed" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#a78bfa"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="300" fill="#ffffff"/>

  <!-- ── SECTION 1: One-time Setup ─────────────────────────────── -->
  <rect x="16" y="12" width="292" height="224" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="162" y="40" text-anchor="middle" fill="#94a3b8" font-size="10" font-weight="700" letter-spacing="0.08em">ONE-TIME SETUP</text>

  <!-- Fork box -->
  <rect x="32" y="54" width="116" height="52" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="90" y="76" text-anchor="middle" fill="#1e293b" font-size="11" font-weight="700">Fork</text>
  <text x="90" y="92" text-anchor="middle" fill="#64748b" font-size="10">on GitHub</text>

  <!-- arrow -->
  <line x1="150" y1="80" x2="168" y2="80" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr-gray)"/>

  <!-- Setup wizard box -->
  <rect x="172" y="54" width="120" height="52" rx="8" fill="#6366f1" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="232" y="76" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">uv run setup.py</text>
  <text x="232" y="92" text-anchor="middle" fill="#c7d2fe" font-size="10">2 min · guided</text>

  <!-- down arrow -->
  <line x1="232" y1="108" x2="232" y2="138" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr-gray)"/>

  <!-- Secrets + config box -->
  <rect x="32" y="142" width="260" height="72" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="36" y="162" fill="#22c55e" font-size="11">✓</text>
  <text x="50" y="162" fill="#475569" font-size="10">GitHub Secrets written automatically</text>
  <text x="36" y="180" fill="#22c55e" font-size="11">✓</text>
  <text x="50" y="180" fill="#475569" font-size="10">config.yml updated &amp; pushed</text>
  <text x="36" y="198" fill="#22c55e" font-size="11">✓</text>
  <text x="50" y="198" fill="#475569" font-size="10">Ready — no code editing needed</text>

  <!-- ── BIG ARROW between sections ───────────────────────── -->
  <line x1="316" y1="124" x2="352" y2="124" stroke="#6366f1" stroke-width="2.5" marker-end="url(#arr-indigo)"/>
  <text x="334" y="118" text-anchor="middle" fill="#6366f1" font-size="9" font-weight="700">THEN</text>

  <!-- ── SECTION 2: Every Morning ──────────────────────────────── -->
  <rect x="356" y="12" width="578" height="256" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="650" y="34" text-anchor="middle" fill="#94a3b8" font-size="10" font-weight="700" letter-spacing="0.08em">EVERY MORNING · FULLY AUTOMATIC</text>

  <!-- ══════ Row 1: Main Pipeline (y=44, h=72) ══════ -->

  <!-- RSS Feeds -->
  <rect x="372" y="44" width="85" height="72" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="414" y="66" text-anchor="middle" fill="#1e293b" font-size="11" font-weight="700">RSS Feeds</text>
  <text x="414" y="83" text-anchor="middle" fill="#64748b" font-size="10">20+ sources</text>
  <text x="414" y="99" text-anchor="middle" fill="#64748b" font-size="10">news · blogs</text>

  <!-- arrow: RSS → LLM -->
  <line x1="457" y1="80" x2="467" y2="80" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr-gray)"/>

  <!-- LLM Analysis -->
  <rect x="467" y="44" width="95" height="72" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="514" y="66" text-anchor="middle" fill="#1e293b" font-size="11" font-weight="700">LLM Analysis</text>
  <text x="514" y="83" text-anchor="middle" fill="#64748b" font-size="10">DeepSeek API</text>
  <text x="514" y="99" text-anchor="middle" fill="#7c3aed" font-size="9" font-weight="600">dedupe vs history</text>

  <!-- arrow: LLM → Digest -->
  <line x1="562" y1="80" x2="572" y2="80" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr-gray)"/>

  <!-- Daily Digest -->
  <rect x="572" y="44" width="85" height="72" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="614" y="66" text-anchor="middle" fill="#1e293b" font-size="11" font-weight="700">Daily Digest</text>
  <text x="614" y="83" text-anchor="middle" fill="#64748b" font-size="10">5 sections</text>
  <text x="614" y="99" text-anchor="middle" fill="#64748b" font-size="10">Markdown</text>

  <!-- arrow: Digest → Lark Doc -->
  <line x1="657" y1="80" x2="667" y2="80" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr-gray)"/>

  <!-- Lark Doc -->
  <rect x="667" y="44" width="85" height="72" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="709" y="66" text-anchor="middle" fill="#1e293b" font-size="11" font-weight="700">Lark Doc</text>
  <text x="709" y="83" text-anchor="middle" fill="#64748b" font-size="10">Cloud docx</text>
  <text x="709" y="99" text-anchor="middle" fill="#64748b" font-size="10">Bot link</text>

  <!-- arrow: Lark Doc → Bot Link -->
  <line x1="752" y1="80" x2="762" y2="80" stroke="#6366f1" stroke-width="2" marker-end="url(#arr-indigo)"/>

  <!-- Bot Link → Your Lark -->
  <rect x="762" y="44" width="75" height="72" rx="8" fill="#6366f1" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="799" y="70" text-anchor="middle" font-size="22">📄</text>
  <text x="799" y="92" text-anchor="middle" fill="#ffffff" font-size="9" font-weight="700">BOT LINK</text>
  <text x="799" y="104" text-anchor="middle" fill="#c7d2fe" font-size="9">→ YOUR LARK</text>

  <!-- ══════ Row 2: State Management &amp; Persistence (y=136, h=50) ══════ -->

  <!-- GitHub Issues box -->
  <rect x="372" y="136" width="175" height="50" rx="8" fill="#faf5ff" stroke="#c4b5fd" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="459" y="156" text-anchor="middle" fill="#6d28d9" font-size="10" font-weight="700">📦 GitHub Issues</text>
  <text x="459" y="174" text-anchor="middle" fill="#7c3aed" font-size="9">ai-dispatch-state / ai-dispatch-report</text>

  <!-- arrow: Issues → Load -->
  <line x1="547" y1="161" x2="557" y2="161" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr-gray)"/>

  <!-- Load State & Reports -->
  <rect x="557" y="136" width="160" height="50" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="637" y="156" text-anchor="middle" fill="#1e293b" font-size="10" font-weight="700">⬇ Load State &amp; Reports</text>
  <text x="637" y="174" text-anchor="middle" fill="#64748b" font-size="9">sent_history.json · report/*.md</text>

  <!-- arrow: Load → Persist -->
  <line x1="717" y1="161" x2="727" y2="161" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr-gray)"/>

  <!-- Persist via Issues -->
  <rect x="727" y="136" width="190" height="50" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="822" y="156" text-anchor="middle" fill="#1e293b" font-size="10" font-weight="700">⬆ Persist via Issues</text>
  <text x="822" y="174" text-anchor="middle" fill="#64748b" font-size="9">save state · publish report Issue</text>

  <!-- ══════ Connector arrows ══════ -->

  <!-- Dashed arrow: Load → LLM (recent reports provide dedup context) -->
  <path d="M 637 136 L 637 124 L 514 124 L 514 116" fill="none" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr-dashed)"/>

  <!-- Solid arrow: Digest → Persist (today's report flows to persist step) -->
  <path d="M 614 116 L 614 128 L 822 128 L 822 136" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr-gray)"/>

  <!-- What's inside -->
  <text x="372" y="216" fill="#1e293b" font-size="10" font-weight="700">What's inside:</text>
  <text x="372" y="232" fill="#64748b" font-size="10">📌 Top Stories · 📈 Trends · 🔬 Papers · 📖 Blog Pick · 💡 Today's Signal</text>
  <text x="372" y="248" fill="#94a3b8" font-size="10">History-aware · No repeat news · GitHub Actions free</text>

  <!-- Footer -->
  <text x="460" y="290" text-anchor="middle" fill="#cbd5e1" font-size="9.5">📡 AI Dispatch · github.com/AkatQuas/ai-dispatch</text>
</svg>
