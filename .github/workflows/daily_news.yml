name: AI Dispatch

on:
  schedule:
    - cron: '0 5 * * *' # 每天 UTC 5:00 准时触发
  workflow_dispatch: # 允许手动触发测试（忽略时间检查，直接发送）

permissions:
  contents: read
  issues: write

concurrency:
  group: ai-dispatch-daily
  cancel-in-progress: false

jobs:
  send-news:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --frozen

      - name: Load state and recent reports from Issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run python issue_store.py load

      - name: Check send hour
        id: timecheck
        run: |
          CONFIG_HOUR=$(grep 'send_hour_utc:' config.yml | awk '{print $2}')
          CURRENT_HOUR=$(date -u +%-H)
          CURRENT_DATE=$(date -u +%Y-%m-%d)
          LAST_SENT=$(python3 -c "import json; d=json.load(open('sent_history.json')); print(d.get('last_sent_date',''))" 2>/dev/null || echo "")

          echo "Config hour (UTC): $CONFIG_HOUR | Current hour (UTC): $CURRENT_HOUR | Last sent: $LAST_SENT | Today: $CURRENT_DATE"

          if [ "$LAST_SENT" = "$CURRENT_DATE" ]; then
            echo "Already sent today, skipping."
            echo "should_send=false" >> $GITHUB_OUTPUT
          elif [ "$CURRENT_HOUR" -ge "$CONFIG_HOUR" ]; then
            echo "Hour $CURRENT_HOUR >= $CONFIG_HOUR and not yet sent today — will send."
            echo "should_send=true" >> $GITHUB_OUTPUT
          else
            echo "Hour $CURRENT_HOUR < $CONFIG_HOUR, too early."
            echo "should_send=false" >> $GITHUB_OUTPUT
          fi

      - name: Fetch and send AI news
        if: steps.timecheck.outputs.should_send == 'true' || github.event_name == 'workflow_dispatch'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          LARK_APP_ID: ${{ secrets.LARK_APP_ID }}
          LARK_SECRET: ${{ secrets.LARK_SECRET }}
          LARK_RECEIVER: ${{ secrets.LARK_RECEIVER }}
          LARK_FOLDER_TOKEN: ${{ secrets.LARK_FOLDER_TOKEN }}
        run: uv run python fetch_news.py

      - name: Persist state and publish report Issue
        if: steps.timecheck.outputs.should_send == 'true' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run python issue_store.py save
          uv run python issue_store.py publish-today
