name: AI Dispatch

on:
  schedule:
    # 默认 UTC 6:00（约伦敦 07:00 BST）；改发送时间请编辑此 cron
    - cron: '0 6 * * *'
  workflow_dispatch: # 手动触发：跳过今日防重，直接发送

permissions:
  contents: read
  issues: write

concurrency:
  group: ai-dispatch-daily
  cancel-in-progress: false

jobs:
  send-news:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --frozen

      - name: Load state and recent reports from Issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run ai-dispatch-issues load

      - name: Check already sent today
        id: dedup
        if: github.event_name != 'workflow_dispatch'
        run: |
          CURRENT_DATE=$(date -u +%Y-%m-%d)
          LAST_SENT=$(python3 -c "import json; d=json.load(open('sent_history.json')); print(d.get('last_sent_date',''))" 2>/dev/null || echo "")

          echo "Last sent: ${LAST_SENT:-<never>} | Today: $CURRENT_DATE"

          if [ "$LAST_SENT" = "$CURRENT_DATE" ]; then
            echo "Already sent today, skipping."
            echo "should_send=false" >> $GITHUB_OUTPUT
          else
            echo "Not yet sent today — will send."
            echo "should_send=true" >> $GITHUB_OUTPUT
          fi

      - name: Fetch, publish report, and send AI news
        if: github.event_name == 'workflow_dispatch' || steps.dedup.outputs.should_send == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          LARK_APP_ID: ${{ secrets.LARK_APP_ID }}
          LARK_SECRET: ${{ secrets.LARK_SECRET }}
          LARK_RECEIVER: ${{ secrets.LARK_RECEIVER }}
          LARK_FOLDER_TOKEN: ${{ secrets.LARK_FOLDER_TOKEN }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_BASE_URL: ${{ secrets.LANGFUSE_BASE_URL }}
        run: uv run ai-dispatch

      - name: Persist state
        if: github.event_name == 'workflow_dispatch' || steps.dedup.outputs.should_send == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run ai-dispatch-issues save
